name: beardO
description: Track my progress related simple tasks.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  bloc: ^8.1.4
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  # Local storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  # State management and DI
  equatable: ^2.0.5
  get_it: ^7.6.4
  injectable: ^2.3.2
  dartz: ^0.10.1
  # UI components
  flutter_svg: ^2.0.9
  image_picker: ^1.0.4
  table_calendar: ^3.0.9
  uuid: ^4.2.1
  cached_network_image: ^3.3.0
  lottie: ^2.7.0
  google_fonts: ^6.1.0
  # Notifications
  flutter_local_notifications: ^19.2.1
  flutter_timezone: ^4.1.1
  # Utils
  logger: ^2.0.2+1
  connectivity_plus: ^5.0.2
  timezone: ^0.10.1
  # Notion API
  notion_api: ^1.1.1
  http: ^1.2.1

dev_dependencies:
  bloc_test: ^9.1.7
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.jpg"
  adaptive_icon_background: "#8A2BE2" # Deep purple background
  adaptive_icon_foreground: "assets/icons/app_icon.jpg"

dependency_overrides:
  # Force http version to be compatible with timezone package
  http: ^1.2.1
